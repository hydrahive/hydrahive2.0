name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Ubuntu 26.04 (Prod) = Python 3.14, Ubuntu 24.04 = 3.12. Beide werden
  # getestet, parallel in zwei Jobs (Spec docs/specs/python-314-umstieg.md).
  # Der Name dieses Jobs ist Pflicht-Check im Branch-Schutz von main —
  # nicht umbenennen und keine Matrix daraus machen (die hängt die Version
  # an den Namen an, und jeder PR wartet auf einen Check, der nie kommt).
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system tools (qemu-img für VM-Disk-Tests)
        timeout-minutes: 5
        run: |
          if ! command -v qemu-img >/dev/null 2>&1; then
            sudo env DEBIAN_FRONTEND=noninteractive \
              apt-get install -y --no-install-recommends qemu-utils
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e core/
          pip install ruff

      - name: Ruff lint
        run: ruff check core/

      # Supply-Chain-Absicherung. Anlass: LiteLLM-Vorfall 24.03.2026 —
      # Versionen 1.82.7/1.82.8 enthielten einen Credential-Stealer und waren
      # ~40 Minuten auf PyPI online; laut CloudSEK waren ~434.000 Build-Pipelines
      # bei 2500+ Firmen betroffen. Ein Build ohne Versionsdeckel zieht so etwas
      # automatisch mit. Deckel stehen jetzt in core/pyproject.toml; dieser Schritt
      # meldet zusaetzlich bekannte Schwachstellen in der aufgeloesten Umgebung.
      #
      # continue-on-error: Der Schritt SOLL informieren, nicht blockieren. Neue
      # CVEs in transitiven Abhaengigkeiten erscheinen taeglich — ein harter Fail
      # wuerde sonst fremde PRs blockieren, ohne dass deren Autor etwas dafuer kann.
      # Ergebnis steht in der Job-Summary.
      - name: Dependency-Audit (informativ)
        continue-on-error: true
        run: |
          pip install pip-audit
          echo "## Dependency-Audit" >> "$GITHUB_STEP_SUMMARY"
          pip-audit --desc off -f markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Run pytest
        run: |
          cd core
          PYTHONPATH=src pytest tests/ -v --tb=short

  backend-py312:
    name: Backend (pytest, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system tools (qemu-img für VM-Disk-Tests)
        timeout-minutes: 5
        run: |
          if ! command -v qemu-img >/dev/null 2>&1; then
            sudo env DEBIAN_FRONTEND=noninteractive \
              apt-get install -y --no-install-recommends qemu-utils
          fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e core/

      - name: Run pytest
        run: |
          cd core
          PYTHONPATH=src pytest tests/ -q --tb=short

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Dateien, die sonst erst `npm run build` (prebuild) erzeugt: Module-, Theme-
      # und Emote-Register. Ohne sie fehlen @/modules/index.generated u. a. – tsc
      # und jeder vitest-Test, der i18n zieht, scheitern dann (ERR_MODULE_NOT_FOUND).
      - name: Generierte Dateien
        working-directory: frontend
        run: |
          node scripts/gen-emotes.mjs
          node scripts/gen-modules.mjs
          node scripts/gen-themes.mjs

      # -b: tsconfig.json hat `files: []` und nur references. Ohne -b prüft tsc
      # keine einzige Datei (Typfehler fielen hier bisher nie auf).
      - name: Type-check
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: ESLint
        working-directory: frontend
        # Blockiert nur bei echten Fehlern (severity=error). Warnungen (react-
        # hooks-v7-Rauschen, exhaustive-deps-Altfälle, explizite any) bleiben
        # sichtbar, brechen den Build aber nicht.
        run: npx eslint .

      - name: Unit-Tests (vitest)
        working-directory: frontend
        run: npx vitest run
