[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hydrahive-core"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = [
    # Obergrenze <0.137: FastAPI 0.137.0 brachte einen Route-Tree-Refactor
    # (fastapi/fastapi#15745, Regression #15762), der include_router-Routen nicht
    # mehr flach in app.routes legt, sondern als verschachtelte `_IncludedRouter`
    # ohne `.path`. Folge: app.routes-Introspektion bricht und das OpenAPI-Schema
    # (/docs, /openapi.json) wird LEER. Bis upstream gefixt ist, bleiben wir auf
    # 0.136.x — identisch zum laufenden Produktivstand. Deckel danach lockern.
    "fastapi>=0.111,<0.137",
    "uvicorn[standard]>=0.30,<1",
    # Obergrenzen bei sicherheitskritischen Paketen: sie begrenzen das Zeitfenster
    # eines Supply-Chain-Angriffs auf PyPI. Ohne Deckel zieht ein frischer Build
    # automatisch die neueste Version — auch eine, die Minuten zuvor kompromittiert
    # veröffentlicht wurde. Genau so lief der LiteLLM-Vorfall am 24.03.2026:
    # 1.82.7/1.82.8 mit Credential-Stealer, ~40 Minuten online, laut CloudSEK
    # ~434.000 Build-Pipelines bei 2500+ Firmen betroffen. Wir hatten nur Glück,
    # dass dieses Repo erst am 28.04.2026 begann.
    # Deckel = nächste Major-Version: Sicherheits-Patches kommen weiter durch,
    # ein unbemerkter Sprung über eine Bruchkante nicht.
    "pyjwt>=2.8,<3",
    "bcrypt>=4.0,<6",
    "cryptography>=41.0,<49",
    "litellm>=1.83,<2",
    "anthropic>=0.105,<1",
    # <2 pinnen: mcp v2 ist ein Major-Rework mit Breaking Changes —
    # streamablehttp_client → streamable_http_client umbenannt UND zieht
    # opentelemetry rein (verletzt den No-Telemetry-Guard). v1 bleibt kompatibel.
    "mcp>=1.0,<2",
    "httpx>=0.27,<1",
    "Pillow>=10.0,<14",
    "playwright>=1.44,<2",
    "yt-dlp>=2024.1",  # CalVer, kein Major-Schema — Deckel waere willkuerlich
    "python-multipart>=0.0.9,<1",
    "pyyaml>=6.0,<7",
    "websockets>=13,<17",
    "croniter>=2.0,<7",
    "discord.py>=2.3,<3",
    "matrix-nio>=0.25,<0.26",
    "asyncpg>=0.29,<1",
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.4,<2",
]

[tool.pytest.ini_options]
# asyncio_mode=auto: `async def test_*` laufen ohne expliziten Marker (die
# vorhandenen @pytest.mark.asyncio bleiben gültig). Ohne pytest-asyncio wurden
# alle async-Tests (TTS/wyoming/generate_music) als Fehler übersprungen.
asyncio_mode = "auto"
# pythonpath: Tests laufen IMMER gegen das Repo (core/src), nie gegen eine
# anderswo installierte hydrahive-Version.
#
# Hintergrund: Auf dem Server liegt ein editable-Install, dessen .pth-Datei
# /opt/hydrahive2/core/src fest in sys.path einträgt. Ohne diesen Eintrag hier
# gewinnt der Produktionsstand — man testet dann unbemerkt den ALTEN Code, und
# neue Module aus dem Arbeitsverzeichnis werfen ModuleNotFoundError.
# Relativ zur rootdir (= core/), gilt für lokale Läufe und CI gleichermaßen.
pythonpath = ["src"]

[project.scripts]
hydrahive = "hydrahive.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/hydrahive"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Pyflakes-Regeln: echte Bugs (undefined names, unused vars, doppelte Defs).
# F401 (unused import) ist deaktiviert — Facade-Module re-exportieren bewusst.
select = ["F"]
ignore = ["F401"]
